<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d8d4ce">
  <meta name="description" content="Monthly Memories — January 2026. Little moments, big memories.">
  <title>Monthly Memories — January 2026</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 0;
      background: #d8d4ce;
    }
    main {
      width: min(100vw, 100svh);
      line-height: 0;
      overflow: hidden;
      background: #e8e5df;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }
    @media (max-aspect-ratio: 1/1) {
      body { display: block; }
      main { width: 100%; }
    }
  </style>
</head>
<body>
  <main aria-label="Monthly Memories scrapbook page for January 2026">
    <img src="assets/monthly-memories-reference.jpg" alt="A warm neutral scrapbook spread titled January 2026, with taped photographs, handwritten notes, dried flowers, and monthly memories." width="1536" height="1536">
  </main>
</body>
</html>
